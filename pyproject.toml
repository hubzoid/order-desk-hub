[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "order-invoice-desk-hub"
version = "0.1.0"
description = "Order & Invoice Desk: a ready-made Hubzoid hub. Inbox to ERP drafts, with a person approving every submission."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Hubzoid", email = "darshika.joshi@hubzoid.com" }]
dependencies = [
  "hubzoid>=1.3.2",       # pinned to the tested SDK commit in hub.lock.json
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.13,<2.14",
  "openpyxl>=3.1.5,<3.2",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
# Docling parses PDFs, images and spreadsheets. It loads lazily, one document
# at a time, so a hub that only takes email text never imports it.
parsing = ["docling>=2.60,<3"]
fixtures = ["reportlab>=4.4,<5"]
dev = ["pytest>=8"]

[project.scripts]
hubzoid-erp = "erp.cli:main"
hubzoid-desk = "desk.cli:main"

[tool.setuptools.packages.find]
include = ["erp*", "desk*"]

[tool.setuptools.package-data]
erp = ["datasets/distributor-v1/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "erp_live: needs the disposable ERPNext test site (docker compose project hubzoid-erpnext-test)",
  "docling: needs the parsing extra and its model assets (heavy)",
  "real_model: needs the installed Claude Code login (claude-local)",
  "engine: runs the real Hubzoid workflow engine in a child process (slow)",
]
addopts = "-m 'not erp_live and not docling and not real_model and not engine'"
