name: order-desk
on:
  push:
  pull_request:
  schedule:
    - cron: "41 3 * * *"        # nightly against the latest Hubzoid 2.x release
permissions:
  contents: read
jobs:
  tests:
    name: tests
    # macOS: the committed sample images were rendered there, and the reproducibility test compares bytes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # the committed sample dataset was generated with 3.12.14, whose email module quotes display names
      - name: Install the desk and Hubzoid 2.x
        run: python -m pip install -e '.[fixtures,dev]'
      - name: "Tests (records, reports, ERP adapter and sample; live ERPNext, Docling, real-model and engine runs excluded)"
        run: python -m pytest --junitxml=output/tests.xml
      - name: Evals parse
        run: hubzoid eval list .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: output/*.xml
