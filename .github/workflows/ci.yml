name: order-desk
on:
  push:
  pull_request:
  schedule:
    - cron: "41 3 * * *"        # nightly against the pinned SDK in requirements-sdk.txt
permissions:
  contents: read
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned SDK and the desk
        run: |
          python -m pip install -r requirements-sdk.txt
          python -m pip install -e '.[fixtures,dev]'
      - name: "Tests (records, reports, ERP adapter and sample; live ERPNext, Docling, real-model and engine runs excluded)"
        run: python -m pytest --junitxml=output/tests.xml
      - name: Evals parse
        run: hubzoid eval list .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: output/*.xml
